[package]
name = "web_tls"
version = "0.5.0"
kind = "library"
# @threadSafe on TlsConfig, TlsTransport and TlsSession is this package's claim (CeeSafe ADR 0025 §3.2; Web ADR 0009 §1).
trusted = true
# OpenSSL >= 3.0 (Web ADR 0002 §3.1), linked through the manifest (CeeSafe ADR 0047). The shim is the only C.
c = ["c/tls_shim.c"]

[target.linux]
links = ["ssl", "crypto"]

[target.macos]
# Homebrew's openssl@3, not the system's LibreSSL.
links = ["ssl", "crypto"]
lib-dirs = ["/opt/homebrew/opt/openssl@3/lib"]
include-dirs = ["/opt/homebrew/opt/openssl@3/include"]

[target.windows]
# OpenSSL's MSVC import libraries (Shining Light's installer, or vcpkg): OPENSSL_DIR is the install directory and
# OPENSSL_LIB_DIR the libraries for this machine, e.g. %OPENSSL_DIR%\lib\VC\arm64\MD (x64: ...\x64\MD).
links = ["libssl", "libcrypto"]
lib-dirs = ["$OPENSSL_LIB_DIR"]
include-dirs = ["$OPENSSL_DIR/include"]

[target.android]
# A phone ships no OpenSSL an app may link: static archives built for it (tools/openssl-mobile.sh), in the directory
# OPENSSL_ANDROID_DIR names for the ABI being built (CeeSafe ADR 0171; a packer such as claywind-pack sets it).
links = ["ssl", "crypto"]
lib-dirs = ["$OPENSSL_ANDROID_DIR/lib"]
include-dirs = ["$OPENSSL_ANDROID_DIR/include"]

[target.ios]
# As Android: OPENSSL_IOS_DIR is the device's archives or the simulator's.
links = ["ssl", "crypto"]
lib-dirs = ["$OPENSSL_IOS_DIR/lib"]
include-dirs = ["$OPENSSL_IOS_DIR/include"]

[target.freebsd]
# The base system's OpenSSL (3.0 on FreeBSD 14, 3.5 on 15), in /usr/lib and /usr/include (ceesafec 0.53.0, CeeSafe ADR 0149).
links = ["ssl", "crypto"]

[dependencies]
web_core = { path = "../web_core" }
web_transport = { path = "../web_transport" }
