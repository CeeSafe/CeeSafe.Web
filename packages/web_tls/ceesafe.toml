[package]
name = "web_tls"
version = "0.1.0"
kind = "library"
# OpenSSL >= 3.0 (Web ADR 0002 §3.1), linked through the manifest (CeeSafe ADR 0047). The shim is the only C.
c = ["c/tls_shim.c"]
links = ["ssl", "crypto"]

[target.macos]
# Homebrew's openssl@3, not the system's LibreSSL.
lib-dirs = ["/opt/homebrew/opt/openssl@3/lib"]
include-dirs = ["/opt/homebrew/opt/openssl@3/include"]

[dependencies]
web_core = { path = "../web_core" }
web_transport = { path = "../web_transport" }
