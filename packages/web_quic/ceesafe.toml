[package]
name = "web_quic"
version = "0.5.0"
kind = "library"
# @threadSafe on QuicTls is this package's claim (CeeSafe ADR 0025 §3.2), as web_tls's on TlsConfig.
trusted = true
# QUIC over ngtcp2 1.26.0 with its OpenSSL backend (Web ADR 0014). The C, the vendored library and the shim this
# package declares (src/), is CeeSafeLibs' `ngtcp2` package, with the include directories and OpenSSL (3.5 or later,
# checked by the shim) it needs: a package can put only its own directories on the C include path (CeeSafe ADRs
# 0047, 0120).

[dependencies]
web_core = { path = "../web_core" }
web_tls = { path = "../web_tls" }
ngtcp2 = { git = "https://github.com/CeeSafe/CeeSafeLibs.git", rev = "b1791218f2e1a0f269eced073f21ab89f2a7ce59", dir = "ngtcp2" }
