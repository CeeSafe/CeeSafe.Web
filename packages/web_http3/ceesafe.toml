[package]
name = "web_http3"
version = "0.5.0"
kind = "library"
# HTTP/3 and QPACK over nghttp3 1.19.0, on web_quic (Web ADR 0014 §3.1, §3.6). The C, the vendored library and the
# shim this package declares (src/), is CeeSafeLibs' `nghttp3` package (see web_quic's manifest).

[dependencies]
web_core = { path = "../web_core" }
web_http = { path = "../web_http" }
web_quic = { path = "../web_quic" }
nghttp3 = { git = "https://github.com/CeeSafe/CeeSafeLibs.git", rev = "b1791218f2e1a0f269eced073f21ab89f2a7ce59", dir = "nghttp3" }
