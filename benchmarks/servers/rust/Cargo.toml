# The Rust comparison servers (Web ADR 0015 §6): one workspace, so Cargo.lock pins every crate for all three.
[workspace]
resolver = "2"
members = ["common", "hyper", "axum", "actix"]

[workspace.dependencies]
bench_common = { path = "common" }
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json"] }
actix-web = { version = "=4.20.0", default-features = false, features = ["macros", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"

# Release builds as the plan asks: optimised, one codegen unit, LTO, no debug assertions.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
