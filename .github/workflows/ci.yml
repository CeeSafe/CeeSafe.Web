# CeeSafe.Web CI (Web ADR 0005 §2.1-2.2): layering, check/fmt/doc per package, tests in the interpreter and natively
# with leak checks, sanitizers and the allocation sweep, on each host and reactor. Released ceesafec only
# (docs/toolchain.md); a separate, non-blocking job builds against CeeSafe main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CEESAFE_VERSION: v0.6.0

jobs:
  test:
    name: ${{ matrix.os }}${{ matrix.reactor && format(' ({0})', matrix.reactor) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            sanitize: true
          - os: ubuntu-22.04
            sanitize: true
          - os: ubuntu-22.04
            reactor: uring
            env_name: CEESAFE_REACTOR_URING
          - os: windows-2022
          - os: windows-2022
            reactor: wsapoll
            env_name: CEESAFE_REACTOR_POLL
    steps:
      - uses: actions/checkout@v4

      - name: Install ceesafec (POSIX)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          echo "$HOME/.ceesafe/bin" >> "$GITHUB_PATH"

      - name: Install ceesafec (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://ceesafe.github.io/CeeSafe/install.ps1 | iex
          "$env:USERPROFILE\.ceesafe\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        shell: bash
        run: ceesafec --version

      - name: Select the reactor
        if: matrix.env_name
        shell: bash
        run: echo "${{ matrix.env_name }}=1" >> "$GITHUB_ENV"

      - name: Layering
        shell: bash
        run: python3 tools/check_layers.py

      - name: Check, format and docs of every package
        shell: bash
        run: |
          set -e
          for p in packages/*/; do
            (cd "$p" && ceesafec fetch --offline && ceesafec check && ceesafec fmt --check && ceesafec doc --missing)
          done

      - name: Tests (ceesafec test, native and interpreter, leak check)
        shell: bash
        run: python3 tools/run_tests.py

      - name: Tests with ASan and UBSan, allocation-failure and cancellation sweeps
        if: matrix.sanitize
        shell: bash
        run: python3 tools/run_tests.py --no-interp --sanitize --alloc-sweep --cancel-sweep

      - name: Example builds
        shell: bash
        run: (cd examples/echo && ceesafec fetch --offline && ceesafec check && ceesafec build -o out/echo)

  probes:
    # The design probes and bug repros (tests/probes/README.md): informational, so a changed outcome is visible
    # without blocking a merge.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          echo "$HOME/.ceesafe/bin" >> "$GITHUB_PATH"
      - run: |
          cd tests/probes
          for f in *.cee; do echo "== $f"; ceesafec check "$f" && ceesafec run --interp "$f" || true; done

  ceesafe-main:
    # Early warning against CeeSafe's main branch (docs/toolchain.md): never required.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          git clone --depth 50 https://github.com/CeeSafe/CeeSafe.git ../CeeSafe
          cd ../CeeSafe && sh tools/bootstrap_release.sh "$HOME/.ceesafe/bin/ceesafec" HEAD out/ceesafec
      - run: python3 tools/run_tests.py --ceesafec ../CeeSafe/out/ceesafec
