# CeeSafe.Web CI (Web ADR 0005 §2.1-2.2): layering, check/fmt/doc per package, tests in the interpreter and natively
# with leak checks, sanitizers and the allocation sweep, on each host and reactor. Released ceesafec only
# (docs/toolchain.md); a separate, non-blocking job builds against CeeSafe main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CEESAFE_VERSION: v0.44.0 # main's minimum from 2026-11-14 (docs/toolchain.md)

jobs:
  test:
    name: ${{ matrix.os }}${{ matrix.reactor && format(' ({0})', matrix.reactor) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # macos-14 is no longer offered (2026-11-06)
            sanitize: true
          # Linux runs on 26.04 (OpenSSL 3.5.5), which web_quic and web_http3 need (Web ADR 0014 §3.3, the owner's
          # answer 5): its sweeps, and every test with io_uring. 24.04 (OpenSSL 3.0.13) keeps web_tls's 3.0 minimum
          # tested, sweeps included, without the two QUIC packages. (22.04's OpenSSL 3.0.2 leaked its own global state
          # when an allocation failed, Web ADR 0002 amendment 5.8, so the 3.0 sweeps were already on 24.04.)
          # Its sweeps link OpenSSL 3.5.9, built from source: 3.5.5's SSL_CTX_add_session mishandled a failed
          # allocation (openssl/openssl#28632, fixed in 3.5.6), and SSL_CTX_free then never ended, growing until the
          # runner was shut down (docs/milestones/M10.md, "CI's Linux sanitizer job"). Its other steps keep 3.5.5.
          - os: ubuntu-26.04
            sanitize: true
            openssl_source: 3.5.9
            openssl_sha256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          - os: ubuntu-26.04
            reactor: uring
            env_name: CEESAFE_REACTOR_URING
          - os: ubuntu-24.04
            sanitize: true
            exclude: web_quic,web_http3
          - os: windows-2022
          - os: windows-2022
            reactor: wsapoll
            env_name: CEESAFE_REACTOR_POLL
    steps:
      - uses: actions/checkout@v4

      - name: Install ceesafec (POSIX)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          echo "$HOME/.ceesafe/bin" >> "$GITHUB_PATH"

      - name: Install ceesafec (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://ceesafe.github.io/CeeSafe/install.ps1 | iex
          "$env:USERPROFILE\.ceesafe\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        shell: bash
        run: ceesafec --version

      # web_tls links OpenSSL >= 3.0 (Web ADR 0002 §3.1; its manifest names where, per system).
      - name: OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: OpenSSL from source, for the sweeps (cache)
        if: matrix.openssl_source
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ~/openssl-${{ matrix.openssl_source }}
          key: openssl-${{ matrix.openssl_source }}-${{ matrix.openssl_sha256 }}-${{ matrix.os }}

      - name: OpenSSL from source, for the sweeps (build)
        if: matrix.openssl_source && steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          v=${{ matrix.openssl_source }}
          curl -fsSL -o "$RUNNER_TEMP/openssl.tar.gz" "https://github.com/openssl/openssl/releases/download/openssl-$v/openssl-$v.tar.gz"
          echo "${{ matrix.openssl_sha256 }}  $RUNNER_TEMP/openssl.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openssl.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$v"
          ./Configure --prefix="$HOME/openssl-$v" --libdir=lib no-docs no-tests > /dev/null
          make -j"$(nproc)" > /dev/null
          make install_sw > /dev/null
          "$HOME/openssl-$v/bin/openssl" version

      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3

      - name: OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The MSVC import libraries of a Shining Light install (lib\VC\<arch>\MD), as web_tls's manifest expects.
          function Find-Lib { Get-ChildItem -Recurse -Filter libssl.lib -Path 'C:\Program Files\OpenSSL*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\MD$' } | Select-Object -First 1 }
          $lib = Find-Lib
          if (-not $lib) { choco install openssl --no-progress -y; $lib = Find-Lib }
          if (-not $lib) { throw "no OpenSSL MSVC libraries found" }
          $root = $lib.Directory
          while ($root -and -not (Test-Path (Join-Path $root.FullName 'include\openssl\ssl.h'))) { $root = $root.Parent }
          if (-not $root) { throw "no OpenSSL headers above $($lib.DirectoryName)" }
          "OPENSSL_DIR=$($root.FullName)" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$($lib.DirectoryName)" >> $env:GITHUB_ENV
          (Join-Path $root.FullName 'bin') >> $env:GITHUB_PATH
          Write-Output "OpenSSL: $($root.FullName), libraries $($lib.DirectoryName)"

      - name: Select the reactor
        if: matrix.env_name
        shell: bash
        run: echo "${{ matrix.env_name }}=1" >> "$GITHUB_ENV"

      - name: Layering
        shell: bash
        run: python3 tools/check_layers.py

      - name: Public API matches docs/api (Web ADR 0015 §4)
        shell: bash
        run: python3 tools/api_check.py

      - name: Check, format and docs of every package
        shell: bash
        run: |
          set -e
          for p in packages/*/; do
            case ",${{ matrix.exclude }}," in *",$(basename "$p"),"*) echo "skip $p (OpenSSL 3.0)"; continue ;; esac
            (cd "$p" && ceesafec fetch --offline && ceesafec check && ceesafec fmt --check && ceesafec doc --missing)
          done

      - name: Tests (ceesafec test, native and interpreter, leak check)
        shell: bash
        run: python3 tools/run_tests.py --timeout 600 --exclude "${{ matrix.exclude }}" # SHA-1's 1M-byte vector, interpreted

      - name: Tests with ASan and UBSan, allocation-failure and cancellation sweeps
        if: matrix.sanitize
        shell: bash
        run: |
          # Ubuntu 26.04's runner was shut down partway through this step, with no output (M10.md, "Release"):
          # on Linux, log memory and disk each minute so the next one shows which ran out.
          if [ "$RUNNER_OS" = Linux ]; then
            (while sleep 60; do echo "resources: $(free -m | awk '/^Mem/{print "mem used " $3 " of " $2 " MiB"}'), $(free -m | awk '/^Swap/{print "swap used " $3 " MiB"}'), $(df -m / | awk 'NR==2{print "disk free " $4 " MiB"}')"; done) &
          fi
          if [ -n "${{ matrix.openssl_source }}" ]; then
            o="$HOME/openssl-${{ matrix.openssl_source }}"
            export CPATH="$o/include" LIBRARY_PATH="$o/lib" LD_LIBRARY_PATH="$o/lib"
            "$o/bin/openssl" version
          fi
          python3 tools/run_tests.py --no-interp --sanitize --alloc-sweep --cancel-sweep --exclude "${{ matrix.exclude }}"

      - name: Example builds
        shell: bash
        run: (cd examples/echo && ceesafec fetch --offline && ceesafec check && ceesafec build -o out/echo)

  probes:
    # The design probes and bug repros (tests/probes/README.md): informational, so a changed outcome is visible
    # without blocking a merge.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          echo "$HOME/.ceesafe/bin" >> "$GITHUB_PATH"
      - run: |
          cd tests/probes
          for f in *.cee; do echo "== $f"; ceesafec check "$f" && ceesafec run --interp "$f" || true; done

  ceesafe-main:
    # Early warning against CeeSafe's main branch (docs/toolchain.md): never required. On 26.04 for OpenSSL 3.5.
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - env:
          CEESAFE_VERSION: v0.3.2 # the stage 0 CeeSafe's bootstrap chain is recorded for (its bootstrap/reference.md)
        run: |
          sudo apt-get install -y libssl-dev
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          git clone https://github.com/CeeSafe/CeeSafe.git ../CeeSafe # in full: the bootstrap chain builds old commits
          cd ../CeeSafe && sh tools/bootstrap_release.sh "$HOME/.ceesafe/bin/ceesafec" HEAD out/ceesafec
      - run: python3 tools/run_tests.py --ceesafec ../CeeSafe/out/ceesafec
